{% extends "base.html" %}
{% block title %}Login | Threshold{% endblock %}

{% block body %}
<section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">

    <div class="card w-full max-w-md bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body p-8">

            <!-- Header -->
            <div class="text-center mb-4">

                <div
                    class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10">
                    <i class="fa-solid fa-feather text-xl text-primary"></i>
                </div>

                <h1 class="text-3xl font-bold text-base-content">
                    Welcome Back
                </h1>

                <p class="mt-2 text-base-content/60">
                    Sign in to continue reading and publishing stories.
                </p>

            </div>

            <!-- Form -->
            <form method="POST" class="space-y-5">

                <!-- Email -->
                <div>
                    <label class="label">
                        <span class="label-text font-medium">
                            Email Address
                        </span>
                    </label>

                    <label class="input input-bordered flex items-center gap-3">
                        <i class="fa-regular fa-envelope text-base-content/50"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            class="grow"
                            required
                            autocomplete="email">
                    </label>
                </div>

                <!-- Password -->
                <div>

                    <div class="flex items-center justify-between mb-2">
                        <label class="font-medium text-sm">
                            Password
                        </label>

                        <a
                            href="#"
                            class="text-sm text-primary hover:underline">
                            Forgot Password?
                        </a>
                    </div>

                    <label class="input input-bordered flex items-center gap-3">

                        <i class="fa-solid fa-lock text-base-content/50"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            class="grow"
                            required
                            autocomplete="current-password">

                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="text-base-content/50 hover:text-primary transition">

                            <i
                                id="eyeIcon"
                                class="fa-regular fa-eye">
                            </i>

                        </button>

                    </label>

                </div>

                <!-- Remember Me -->
                <div class="flex items-center justify-between">

                    <label class="flex items-center gap-3 cursor-pointer">
                        <input
                            type="checkbox"
                            name="remember"
                            class="checkbox checkbox-primary checkbox-sm">

                        <span class="text-sm text-base-content/70">
                            Keep me signed in
                        </span>
                    </label>

                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    class="btn btn-primary w-full">

                    Sign In

                    <i class="fa-solid fa-arrow-right ml-1"></i>

                </button>

            </form>

            <!-- Divider -->
            <div class="divider my-6 text-base-content/40">
                OR
            </div>

            <!-- Footer -->
            <p class="text-center text-sm text-base-content/70">

                Don't have an account?

                <a
                    href="{{ url_for('users.signup') }}"
                    class="font-semibold text-primary hover:underline">

                    Create one

                </a>

            </p>

        </div>
    </div>

</section>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
    }
}
</script>
{% endblock %}
