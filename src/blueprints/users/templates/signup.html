{% extends "base.html" %} {% block title %}Sign Up | Threshold{% endblock %} {%
block body %}
<section
  class="min-h-[calc(100vh-4rem)] flex items-center justify-center bg-base-200/30 px-4 pb-12 pt-6"
>
  <div
    class="card w-full max-w-md bg-base-100 border border-base-300 shadow-sm"
  >
    <div class="card-body p-8">
      <!-- Header -->
      <div class="text-center mb-4">
        <div
          class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary/10"
        >
          <i class="fa-solid fa-user-plus text-xl text-primary"></i>
        </div>

        <h1 class="text-3xl font-bold text-base-content">Create Account</h1>

        <p class="mt-2 text-base-content/60">
          Join Threshold and start publishing stories.
        </p>
      </div>

      <!-- Form -->
      <form method="POST" enctype="multipart/form-data" class="space-y-5">
        <!-- Name -->
        <div>
          <label class="label">
            <span class="label-text font-medium"> Full Name </span>
          </label>

          <label class="input input-bordered flex items-center gap-3">
            <i class="fa-regular fa-user text-base-content/50"></i>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="John Doe"
              class="grow"
              required
              autocomplete="name"
            />
          </label>
        </div>

        <!-- Username -->
        <div>
          <label class="label">
            <span class="label-text font-medium"> Username </span>
          </label>

          <label class="input input-bordered flex items-center gap-3">
            <i class="fa-solid fa-at text-base-content/50"></i>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="johndoe"
              class="grow"
              required
              autocomplete="username"
            />
          </label>
        </div>

        <!-- Email -->
        <div>
          <label class="label">
            <span class="label-text font-medium"> Email Address </span>
          </label>

          <label class="input input-bordered flex items-center gap-3">
            <i class="fa-regular fa-envelope text-base-content/50"></i>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              class="grow"
              required
              autocomplete="email"
            />
          </label>
        </div>

        <!-- Password -->
        <div>
          <label class="label">
            <span class="label-text font-medium"> Password </span>
          </label>

          <label class="input input-bordered flex items-center gap-3">
            <i class="fa-solid fa-lock text-base-content/50"></i>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              class="grow"
              required
              minlength="8"
              autocomplete="new-password"
            />

            <button
              type="button"
              onclick="togglePassword('password', 'passwordEye')"
              class="text-base-content/50 hover:text-primary transition"
            >
              <i id="passwordEye" class="fa-regular fa-eye"> </i>
            </button>
          </label>

          <label class="label">
            <span class="label-text-alt text-base-content/50">
              At least 8 characters
            </span>
          </label>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="label">
            <span class="label-text font-medium"> Confirm Password </span>
          </label>

          <label class="input input-bordered flex items-center gap-3">
            <i class="fa-solid fa-shield-halved text-base-content/50"></i>

            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Confirm your password"
              class="grow"
              required
              autocomplete="new-password"
            />

            <button
              type="button"
              onclick="togglePassword('confirm_password', 'confirmEye')"
              class="text-base-content/50 hover:text-primary transition"
            >
              <i id="confirmEye" class="fa-regular fa-eye"> </i>
            </button>
          </label>
        </div>

        <!-- Profile Photo -->
        <div>
          <label class="label">
            <span class="label-text font-medium"> Profile Photo </span>
          </label>

          <input
            type="file"
            id="avatar"
            name="avatar"
            accept="image/*"
            class="file-input file-input-bordered w-full"
          />
        </div>

        <!-- Terms -->
        <label class="flex items-start gap-3 cursor-pointer">
          <input
            type="checkbox"
            name="terms"
            class="checkbox checkbox-primary checkbox-sm mt-1"
            required
          />

          <span class="text-sm text-base-content/70">
            I agree to the

            <a href="#" class="text-primary hover:underline">
              Terms of Service
            </a>
          </span>
        </label>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-full">
          Create Account

          <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider my-6 text-base-content/40">OR</div>

      <!-- Footer -->
      <p class="text-center text-sm text-base-content/70">
        Already have an account?

        <a
          href="{{ url_for('users.login') }}"
          class="font-semibold text-primary hover:underline"
        >
          Sign In
        </a>
      </p>
      <!-- Divider -->
      <div class="divider my-6 text-base-content/40">OR</div>

      <!-- Footer -->
      <a
        href="{{url_for('users.google_oauth')}}"
        class="btn btn-outline w-full"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          x="0px"
          y="0px"
          width="40"
          height="40"
          viewBox="0 0 48 48"
        >
          <path
            fill="#FFC107"
            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
          ></path>
          <path
            fill="#FF3D00"
            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
          ></path>
          <path
            fill="#4CAF50"
            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
          ></path>
          <path
            fill="#1976D2"
            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
          ></path>
        </svg>

        Continue with Google
      </a>
    </div>
  </div>
</section>

<script>
  function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }
</script>
{% endblock %}
