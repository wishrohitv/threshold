{% extends "base.html" %} {% block title %} Page Not Found {% endblock %} {%
block body %}

<div
  class="mx-auto flex min-h-[70vh] max-w-3xl items-center justify-center px-4"
>
  <div
    class="w-full rounded-2xl border border-base-300 bg-base-100 p-8 text-center shadow-sm"
  >
    <div class="mb-4">
      <i class="fa-solid fa-compass text-5xl text-base-content/30"></i>
    </div>

    <h1 class="text-5xl font-bold">404</h1>

    <h2 class="mt-3 text-2xl font-semibold">Page Not Found</h2>

    <p class="mt-4 text-base-content/70">
      The page you're looking for doesn't exist or may have been moved.
    </p>

    <div
      class="mt-4 rounded-lg bg-base-200 px-4 py-3 text-sm text-base-content/60"
    >
      {{ request.path }}
    </div>

    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a href="/" class="btn btn-primary">
        <i class="fa-solid fa-house"></i>
        Home
      </a>

      <a href="/search" class="btn btn-outline">
        <i class="fa-solid fa-magnifying-glass"></i>
        Search Stories
      </a>
    </div>
  </div>
</div>

{% endblock %}
