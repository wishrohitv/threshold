{% extends "base.html" %}
{% block title %} blogs {% endblock %}
<!-- <link rel="stylesheet" href="{{ url_for('static', filename='storiescss/style.css') }}"> -->

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; flex-direction: column; margin-left: 30px; margin-right: 30px;">

    <!-- create stories -->
    <div class="stories-label">
        <h1 style="font-weight: 700; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;" class="stories-and-articls">STORIES and ARTICLS</h1>
        <a href="{{ url_for('stories.create') }}" class="pencil">
            <svg xmlns="http://www.w3.org/2000/svg" width="19"
                height="19" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
                <path
                    d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325" />
            </svg>
        </a>
    </div>

    <!-- show user stoires -->
    {% if bgPost %}
    {% for model_db in bgPost %}

    <div class="card card-side bg-base-100 shadow-xl">
        <figure><img src="https://img.daisyui.com/images/stock/photo-1635805737707-575885ab0820.jpg" alt="Movie" />
        </figure>
        <div class="card-body">
            <h2 class="card-title">{{ model_db.title }}</h2>
            <p>{{ model_dbdesc }}</p>
            <a href="{{ url_for('stories.readByStoryId', storie_id=model_db.pid) }}" class="btn btn-primary">Read</a>
        </div>
    </div>
    <br>

    <ul>
        <li>
            <a href="{{ url_for('stories.delete', pid=model_db.pid) }}" style="color: rgb(255, 3, 3);">delete</a>
        </li>
    </ul>

    {% endfor %}

    {% else %}
    <p>no posts</p>
    {% endif %}

</div>
<style>
    .stories-label {
        display: flex;
        justify-content: space-around;
        align-content: space-between;
        width: 100%;
        
    }

    .stories-and-articls:hover{
        color: rgb(141, 4, 253);
        border-style: solid;
        border-radius: 20px;
        border-color: rgb(137, 11, 255);
    }
    .pencil{
        border-style: solid;
        border-color: rgb(137, 11, 255);
        border-radius: 20px;
    }
    .pencil:hover{
        color: rgb(141, 4, 253);
        border-style: solid;
        border-radius: 20px;
        border-color: rgb(137, 11, 255);
    }
</style>
{% endblock %}
